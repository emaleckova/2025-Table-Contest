project:
  type: book

book:
  title: "{gt} tables for scientific projects"
  author: "Eva Maleckova"
  date: "Oct 14 2025"
  repo-url: "https://github.com/emaleckova/2025-Table-Contest"
  repo-actions: ["source", "issue"]
  chapters:
    - index.qmd
    - 01-Getting_started.qmd
    - 02-Publication_table.qmd
    - 03-Plot_table_assembly.qmd
    - 04-Poster_design.qmd
    - 05-Interactivate_table.qmd
    - 06-Column_fill.qmd
    - 07-Appendix.qmd
    - 08-Resources.qmd

number-depth: 3

format:
  html:
    theme: cosmo
    embed-resources: true
    code-overflow: wrap
    grid:
      margin-width: 200px
      body-width: 900px

toc: true
toc-expand: true
toc-depth: 3
number-sections: true

echo: true
message: false
warning: false
